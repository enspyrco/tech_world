name: realm
description: >-
  Realm — a multiplayer worldbuilding engine. Hosts named rooms; each room
  instantiates a World. Provides the shared substrate (identity, presence,
  voice, room transport, blob storage) so a world can be just its own
  vocabulary. See DESIGN.md for the architectural pin.
publish_to: none
version: 0.0.1
# LICENSE file not yet shipped. The license itself is DECIDED — AGPL v3 with a
# linking exception, so that worlds built on the engine may carry any license
# (see DESIGN.md, "License and business model"). What remains is wording, not
# choice: AGPL-plus-linking-exception is less standard than the GPL Classpath
# exception and wants a legal read, then a CLA, then the NOTICE/header sweep.

environment:
  sdk: ^3.6.0

resolution: workspace

dev_dependencies:
  test: ^1.25.0
