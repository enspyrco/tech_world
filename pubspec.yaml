name: tech_world

# Not a pub workspace. The Realm engine and its plugins moved to
# enspyrco/realm (2026-10-27) and arrive as the git dependencies below. Root
# `flutter test` never runs a workspace member's tests, so CI refuses a
# `workspace:` key here until a member-test loop exists (see test.yml).
description: "A world of tech adventures."
publish_to: "none"
version: 0.0.0+1

environment:
  sdk: ^3.6.0
  # THE Flutter pin: CI and deploy read it (flutter-version-file), Renovate bumps
  # it and regenerates pubspec.lock on the new version in the same PR. Exact on
  # purpose: the lockfile only reproduces on the Flutter that wrote it, so
  # `flutter pub get` refuses any other. Upgrade your local Flutter to match.
  flutter: 3.47.8

dependencies:
  flutter:
    sdk: flutter
  # Realm engine core + its Firebase plugin, from enspyrco/realm. Both entries pin
  # the SAME full commit SHA: realm_firebase reaches realm_core through a sibling
  # `path:` dep that pub resolves to "this repo at the resolved commit", so a
  # tag or branch ref fails to resolve and a half-bumped pair fails `pub get`.
  # Renovate groups the two refs into one PR (renovate.json); by hand: change
  # both refs, `flutter pub get`, commit pubspec + lock. To
  # co-develop against a local ../realm checkout, use a gitignored
  # pubspec_overrides.yaml (realm's README shows one).
  # The app consumes engine types (RealmCredential, LiveKitTokenEndpoint) and
  # FirebaseAuthProvider to drive the token path via realm-token-server
  # (enspyrco/realm-token-server, OCI). The retrieveLiveKitToken Cloud Function
  # it replaced is retired.
  realm_core:
    git:
      url: https://github.com/enspyrco/realm.git
      ref: 3ada1c9eb85216496b5b7fb46d0384f6bd16542f
      path: packages/realm_core
  realm_firebase:
    git:
      url: https://github.com/enspyrco/realm.git
      ref: 3ada1c9eb85216496b5b7fb46d0384f6bd16542f
      path: packages/realm_firebase
  livekit_client: ^2.5.1
  dart_webrtc: ^1.6.0 # MediaStreamTrackWeb typed access to jsTrack
  flutter_webrtc: ^1.2.0 # Required for controls.dart
  shared_preferences: ^2.2.3 # currently used by livekit code
  flame: ^1.18.0
  pathfinding: ^3.0.1
  firebase_core: ^4.1.1
  cloud_firestore: ^6.0.2
  firebase_crashlytics: ^5.0.6
  firebase_auth: ^6.1.0
  sign_in_with_apple: ^7.0.1
  crypto: ^3.0.6
  google_sign_in: ^7.2.0
  # Web-only: direct dependency so we can import web_only.dart's renderButton()
  # (the GIS-rendered button is the only way to start interactive sign-in on web).
  google_sign_in_web: ^1.1.3
  firebase_storage: ^13.0.5
  file_picker: ^13.0.0
  image_picker: ^1.1.2
  http: ^1.2.0
  collection: ^1.19.1
  ffi: ^2.1.5
  web: ^1.1.0 # For web video capture APIs
  code_forge_web: ^2.9.0
  re_highlight: ^0.0.3
  tiled: ^0.12.0 # TMX/TSX parser only — no rendering
  xml: ^7.1.0
  logging: ^1.3.0
  meta: ^1.16.0
  path_provider: ^2.1.5
  url_launcher: ^6.3.2


dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flame_test: ^1.15.0

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  fake_cloud_firestore: ^4.2.0 # 4.2.0 is the first to support cloud_firestore 6.7.x
  flutter_native_splash: ^2.4.7
  mocktail: ^1.0.4
  fake_async: ^1.3.3
  image: ^4.5.2 # Used by tool/slice_tileset.dart only

flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  ios: true
  macos:
    generate: true
    image_path: "assets/icon/app_icon.png"
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#000000"
    theme_color: "#000000"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/tilesets/
    # Character parts, extracted by tool/extract_character_parts.py. Flutter
    # asset globs are not recursive, so each slot directory is listed.
    - assets/images/parts/body/
    - assets/images/parts/hair/
    - assets/images/parts/outfit/
    - assets/images/parts/accessory/
  shaders:
    - shaders/video_bubble.frag
    - shaders/metaball_field.frag
    - shaders/merged_video_bubble.frag
