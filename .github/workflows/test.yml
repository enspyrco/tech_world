name: Test on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.filter.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check if docs-only change
        id: filter
        run: |
          # Get list of changed files in PR
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          echo "Changed files:"
          echo "$CHANGED_FILES"

          # Check if all changes are docs (md, txt, LICENSE, etc.)
          DOCS_ONLY="true"
          while IFS= read -r file; do
            if [[ -n "$file" && ! "$file" =~ \.(md|txt|MD|TXT)$ && "$file" != "LICENSE" && "$file" != "CHANGELOG" ]]; then
              DOCS_ONLY="false"
              break
            fi
          done <<< "$CHANGED_FILES"

          echo "docs_only=$DOCS_ONLY" >> $GITHUB_OUTPUT
          echo "Docs only: $DOCS_ONLY"

  test:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # The version comes from pubspec.yaml's environment.flutter, the one
          # pin Renovate bumps (with a regenerated lockfile in the same PR).
          flutter-version-file: pubspec.yaml
      - name: Install dependencies
        run: flutter pub get --enforce-lockfile
      - name: Analyze code
        run: flutter analyze --fatal-infos
      - name: Run tests with coverage
        run: flutter test --coverage
      - name: Refuse untested workspace members
        # tech_world stopped being a pub workspace when the Realm engine moved
        # to enspyrco/realm (2026-10-27), whose CI runs and gates the engine's
        # tests. Root `flutter test` does NOT descend into workspace members, so
        # members declared here again would have their tests silently skipped.
        # This step replaced the member-test loop: restore a fail-closed loop
        # (enspyrco/realm's ci.yml binds one to the declared workspace) in the
        # same PR that re-adds members.
        run: |
          if grep -qE '^workspace:' pubspec.yaml; then
            echo "::error file=pubspec.yaml::pubspec.yaml declares workspace members but this workflow has no member-test loop, so their tests would never run. Restore one before adding members."
            exit 1
          fi
      - name: Install lcov
        run: sudo apt-get install -y lcov
      - name: Remove untestable files from coverage
        run: |
          lcov --ignore-errors unused --remove coverage/lcov.info \
            '*/native/video_frame_ffi.dart' \
            '*/native/video_frame_web_stub.dart' \
            '*/native/video_frame_web_v2_stub.dart' \
            '*/flame/components/video_bubble_component.dart' \
            '*/auth/auth_service.dart' \
            '*/flame/tiles/predefined_tilesets.dart' \
            -o coverage/lcov.info
      - name: Report coverage on PR
        uses: zgosalvez/github-actions-report-lcov@v7
        with:
          coverage-files: coverage/lcov.info
          minimum-coverage: 50
          github-token: ${{ secrets.GITHUB_TOKEN }}
          update-comment: true
